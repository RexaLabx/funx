<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Repository Manager</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            max-width: 100vw;
            overflow-x: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: hsla(209, 9%, 13%, 1);
            color: hsla(209, 20%, 95%, 1);
            line-height: 1.4;
            min-height: 100vh;
        }

        img, video {
            max-width: 100%;
            height: auto;
        }

        :root {
            --bg-base: hsla(209, 9%, 13%, 1);
            --bg-surface: hsla(209, 9%, 18%, 1);
            --bg-surface-elevated: hsla(209, 9%, 22%, 1);
            --bg-surface-variant: hsla(209, 9%, 28%, 1);
            --primary: hsla(208, 80%, 58%, 1);
            --primary-hover: hsla(208, 80%, 48%, 1);
            --text-primary: hsla(209, 20%, 95%, 1);
            --text-secondary: hsla(209, 10%, 70%, 1);
            --text-muted: hsla(209, 10%, 55%, 1);
            --border-color: hsla(209, 9%, 28%, 1);
            --danger: hsla(0, 65%, 48%, 1);
            --danger-hover: hsla(0, 65%, 38%, 1);
            --overlay-bg: hsla(0, 0%, 0%, 0.65);
        }

        .app-header {
            background-color: hsla(209, 9%, 15%, 0.95);
            border-bottom: 0.0625rem solid var(--border-color);
            padding: clamp(0.5rem, calc(0.4rem + 0.5vw), 0.875rem) clamp(1rem, calc(0.8rem + 2vw), 2.5rem);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 0.625rem;
        }

        .brand-icon {
            width: clamp(1.375rem, calc(1.1rem + 0.8vw), 1.875rem);
            height: clamp(1.375rem, calc(1.1rem + 0.8vw), 1.875rem);
            fill: var(--text-primary);
        }

        .brand-title {
            font-size: clamp(1rem, calc(0.9rem + 0.6vw), 1.375rem);
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.01rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            flex-wrap: wrap;
        }

        .token-input-group {
            display: flex;
            align-items: center;
            background-color: var(--bg-surface);
            border: 0.0625rem solid var(--border-color);
            border-radius: 1rem;
            padding: 0.25rem 0.375rem 0.25rem 0.625rem;
            gap: 0.5rem;
            max-width: clamp(14rem, calc(10rem + 12vw), 22rem);
            width: 100%;
        }

        .token-input-group svg {
            width: 1.125rem;
            height: 1.125rem;
            fill: var(--text-muted);
            flex-shrink: 0;
        }

        .input-field {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: clamp(0.8125rem, calc(0.75rem + 0.25vw), 0.875rem);
            width: 100%;
            font-family: inherit;
        }

        .token-saved-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.375rem;
            padding: clamp(0.35rem, calc(0.25rem + 0.3vw), 0.5rem) clamp(0.625rem, calc(0.4rem + 0.6vw), 1rem);
            border-radius: 1rem;
            font-size: clamp(0.8125rem, calc(0.75rem + 0.25vw), 0.875rem);
            font-weight: 500;
            cursor: pointer;
            border: 0.0625rem solid transparent;
            transition: background-color 0.15s ease, border-color 0.15s ease;
            font-family: inherit;
        }

        .btn svg {
            width: 1rem;
            height: 1rem;
            fill: currentColor;
            flex-shrink: 0;
        }

        .btn-primary {
            background-color: var(--primary);
            color: hsla(209, 20%, 98%, 1);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: var(--bg-surface-elevated);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .btn-secondary:hover {
            background-color: var(--bg-surface-variant);
        }

        .btn-danger {
            background-color: var(--danger);
            color: hsla(0, 0%, 100%, 1);
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        .btn-icon-only {
            padding: 0.4rem;
            border-radius: 0.75rem;
        }

        .main-container {
            padding: clamp(0.75rem, calc(0.5rem + 1.5vw), 2rem);
            max-width: 90rem;
            margin: 0 auto;
            width: 100%;
        }

        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .controls-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .search-box {
            display: flex;
            align-items: center;
            background-color: var(--bg-surface);
            border: 0.0625rem solid var(--border-color);
            border-radius: 1rem;
            padding: 0.375rem 0.625rem;
            gap: 0.5rem;
            min-width: clamp(12rem, calc(8rem + 10vw), 18rem);
        }

        .search-box svg {
            width: 1.125rem;
            height: 1.125rem;
            fill: var(--text-muted);
        }

        .select-all-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: clamp(0.8125rem, calc(0.75rem + 0.25vw), 0.875rem);
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
            background-color: var(--bg-surface);
            padding: 0.375rem 0.75rem;
            border-radius: 1rem;
            border: 0.0625rem solid var(--border-color);
        }

        /* CUSTOM ROUNDED CHECKBOX */
        .checkbox-custom {
            width: 1.125rem;
            height: 1.125rem;
            appearance: none;
            -webkit-appearance: none;
            border: 0.125rem solid var(--text-muted);
            border-radius: 50%;
            outline: none;
            cursor: pointer;
            position: relative;
            background-color: var(--bg-surface-elevated);
            transition: all 0.2s ease;
            vertical-align: middle;
            flex-shrink: 0;
        }

        .checkbox-custom:checked {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .checkbox-custom:checked::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0.375rem;
            height: 0.375rem;
            background-color: #ffffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(clamp(13rem, calc(11rem + 6vw), 18rem), 1fr));
            gap: 0.875rem;
        }

        .repo-card {
            background-color: var(--bg-surface);
            border: 0.0625rem solid var(--border-color);
            border-radius: 1.25rem;
            padding: clamp(0.75rem, calc(0.6rem + 0.4vw), 1rem);
            display: flex;
            flex-direction: column;
            gap: 0.625rem;
            opacity: 0;
            transform: translateY(0.75rem);
            animation: cardEntrance 0.3s ease forwards;
            animation-delay: calc(var(--stagger-index, 0) * 0.03s);
            transition: border-color 0.15s ease, transform 0.15s ease;
        }

        .repo-card:hover {
            border-color: var(--primary);
            transform: translateY(-0.125rem);
        }

        .repo-card.selected {
            border-color: var(--primary);
            background-color: var(--bg-surface-elevated);
        }

        @keyframes cardEntrance {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .repo-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .repo-title-area {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            word-break: break-all;
            overflow: hidden;
        }

        .repo-name {
            font-size: clamp(0.875rem, calc(0.825rem + 0.3vw), 1rem);
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            font-size: 0.6875rem;
            padding: 0.15rem 0.5rem;
            border-radius: 0.75rem;
            border: 0.0625rem solid var(--border-color);
            color: var(--text-secondary);
            background-color: var(--bg-surface-elevated);
            flex-shrink: 0;
        }

        .repo-desc {
            font-size: clamp(0.75rem, calc(0.7rem + 0.2vw), 0.8125rem);
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 2.1rem;
        }

        .repo-card-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.375rem;
            border-top: 0.0625rem solid var(--border-color);
            padding-top: 0.5rem;
        }

        /* WORKSPACE / FILE EDITOR */
        .workspace-top-bar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .workspace-layout {
            display: grid;
            grid-template-columns: clamp(12rem, calc(10rem + 6vw), 18rem) 1fr;
            gap: 1rem;
            min-height: clamp(25rem, calc(18rem + 25vh), 45rem);
        }

        @media (max-width: 48rem) {
            .workspace-layout {
                grid-template-columns: 1fr;
            }
        }

        .workspace-sidebar {
            background-color: var(--bg-surface);
            border: 0.0625rem solid var(--border-color);
            border-radius: 1.25rem;
            padding: 0.875rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 0.5rem;
            border-bottom: 0.0625rem solid var(--border-color);
        }

        .sidebar-title {
            font-size: clamp(0.8125rem, calc(0.75rem + 0.25vw), 0.9375rem);
            font-weight: 600;
            color: var(--text-primary);
        }

        .file-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            overflow-y: auto;
            max-height: clamp(18rem, calc(12rem + 20vh), 30rem);
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.375rem 0.5rem;
            border-radius: 0.75rem;
            cursor: pointer;
            font-size: clamp(0.75rem, calc(0.7rem + 0.2vw), 0.8125rem);
            color: var(--text-secondary);
            transition: background-color 0.15s ease;
        }

        .file-item:hover, .file-item.active {
            background-color: var(--bg-surface-elevated);
            color: var(--text-primary);
        }

        .file-item-info {
            display: flex;
            align-items: center;
            gap: 0.375rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-item-info svg {
            width: 1rem;
            height: 1rem;
            fill: var(--text-secondary);
            flex-shrink: 0;
        }

        .file-item-actions {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .file-item:hover .file-item-actions {
            opacity: 1;
        }

        .workspace-main {
            background-color: var(--bg-surface);
            border: 0.0625rem solid var(--border-color);
            border-radius: 1.25rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .editor-header {
            background-color: var(--bg-surface-elevated);
            border-bottom: 0.0625rem solid var(--border-color);
            padding: 0.5rem 0.875rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.625rem;
            flex-wrap: wrap;
        }

        .current-file-path {
            font-size: clamp(0.75rem, calc(0.7rem + 0.25vw), 0.875rem);
            font-family: monospace;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .editor-tabs {
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0.3rem 0.625rem;
            border-radius: 0.75rem;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .tab-btn.active {
            background-color: var(--bg-surface-variant);
            color: var(--text-primary);
        }

        .editor-container {
            display: flex;
            flex: 1;
            position: relative;
            min-height: clamp(18rem, calc(12rem + 20vh), 30rem);
            background-color: hsla(209, 9%, 10%, 1);
        }

        .line-numbers {
            width: clamp(2rem, calc(1.8rem + 0.6vw), 3rem);
            background-color: hsla(209, 9%, 12%, 1);
            border-right: 0.0625rem solid var(--border-color);
            color: var(--text-muted);
            font-family: monospace;
            font-size: 0.75rem;
            line-height: 1.4;
            padding: 0.625rem 0;
            text-align: right;
            user-select: none;
            overflow: hidden;
        }

        .line-number-item {
            padding-right: 0.375rem;
        }

        .code-textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: monospace;
            font-size: clamp(0.75rem, calc(0.7rem + 0.25vw), 0.875rem);
            line-height: 1.4;
            padding: 0.625rem;
            resize: none;
            white-space: pre;
            tab-size: 2;
            overflow: auto;
        }

        .editor-footer {
            background-color: var(--bg-surface-elevated);
            border-top: 0.0625rem solid var(--border-color);
            padding: 0.3rem 0.875rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.6875rem;
            color: var(--text-muted);
        }

        .preview-iframe {
            width: 100%;
            height: 100%;
            min-height: clamp(18rem, calc(12rem + 20vh), 30rem);
            border: none;
            background-color: hsla(0, 0%, 100%, 1);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--overlay-bg);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background-color: var(--bg-surface);
            border: 0.0625rem solid var(--border-color);
            border-radius: 1.25rem;
            width: 100%;
            max-width: clamp(18rem, calc(16rem + 12vw), 28rem);
            padding: clamp(1rem, calc(0.8rem + 0.8vw), 1.5rem);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            transform: scale(0.95);
            transition: transform 0.2s ease;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-title {
            font-size: clamp(1rem, calc(0.9rem + 0.4vw), 1.25rem);
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .form-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-input {
            background-color: var(--bg-surface-elevated);
            border: 0.0625rem solid var(--border-color);
            border-radius: 0.75rem;
            padding: 0.4rem 0.625rem;
            color: var(--text-primary);
            font-size: 0.8125rem;
            outline: none;
            font-family: inherit;
        }

        .form-input:focus {
            border-color: var(--primary);
        }

        .form-checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8125rem;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .modal-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.5rem;
            margin-top: 0.25rem;
        }

        .toast-container {
            position: fixed;
            bottom: 1.25rem;
            right: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            z-index: 300;
            pointer-events: none;
        }

        .toast {
            background-color: var(--bg-surface-elevated);
            border: 0.0625rem solid var(--border-color);
            border-radius: 0.75rem;
            padding: 0.625rem 0.875rem;
            color: var(--text-primary);
            font-size: 0.8125rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 0.5rem 1.5rem hsla(0, 0%, 0%, 0.4);
            pointer-events: auto;
            animation: toastIn 0.2s ease forwards;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(0.75rem);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hidden {
            display: none !important;
        }

        .empty-state {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
            font-size: 0.875rem;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 0.375rem;
            font-size: clamp(0.8125rem, calc(0.75rem + 0.3vw), 1rem);
            font-weight: 600;
        }

        .breadcrumb-item {
            color: var(--text-secondary);
            cursor: pointer;
        }

        .breadcrumb-item:hover {
            color: var(--text-primary);
        }

        .breadcrumb-separator {
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="brand-container">
            <svg class="brand-icon" viewBox="0 0 24 24">
                <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
            </svg>
            <h1 class="brand-title">GitHub Manager</h1>
        </div>

        <div class="header-actions">
            <!-- TOKEN INPUT AREA -->
            <div id="tokenInputContainer" class="token-input-group">
                <svg viewBox="0 0 24 24">
                    <path d="M7 10h10v2H7zm0 4h7v2H7zm0-8h10v2H7zm13-4H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 18H4V4h16v16z"/>
                </svg>
                <input type="password" id="tokenInput" class="input-field" placeholder="Enter Personal Token">
                <button id="saveTokenBtn" class="btn btn-primary" style="padding: 0.25rem 0.625rem; font-size: 0.75rem; border-radius: 0.75rem;">Save Token</button>
            </div>

            <!-- SAVED TOKEN BADGE AREA -->
            <div id="tokenSavedContainer" class="token-saved-group hidden">
                <span class="badge" style="background-color: var(--bg-surface-elevated); color: var(--primary); border-color: var(--primary); font-weight: 600;">
                    ✓ Token Saved
                </span>
                <button id="changeTokenBtn" class="btn btn-secondary btn-icon-only" title="Change Token">
                    <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                </button>
            </div>

            <button id="openNewRepoModalBtn" class="btn btn-primary">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                New Repo
            </button>
        </div>
    </header>

    <main class="main-container">
        <!-- REPOSITORIES VIEW -->
        <section id="reposView">
            <div class="controls-bar">
                <div class="controls-left">
                    <div class="search-box">
                        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                        <input type="text" id="repoSearchInput" class="input-field" placeholder="Search repositories...">
                    </div>
                    <label class="select-all-container">
                        <input type="checkbox" id="selectAllCheckbox" class="checkbox-custom">
                        Select All
                    </label>
                    <button id="deleteSelectedBtn" class="btn btn-danger hidden">
                        <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        Delete Selected (<span id="selectedCount">0</span>)
                    </button>
                </div>
                <button id="refreshReposBtn" class="btn btn-secondary">
                    <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                    Refresh List
                </button>
            </div>

            <div id="reposGrid" class="repo-grid">
                <!-- Repo cards render here -->
            </div>
        </section>

        <!-- WORKSPACE VIEW -->
        <section id="workspaceView" class="hidden">
            <div class="workspace-top-bar">
                <button id="backToReposBtn" class="btn btn-secondary">
                    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                    Back to Repositories

                <div class="breadcrumb">

                    <span class="breadcrumb-separator">/</span>

                </div>

            <div class="workspace-layout">
                <aside class="workspace-sidebar">
                    <div class="sidebar-header">
                        <span class="sidebar-title">Files</span>
                        <div style="display: flex; gap: 0.25rem;">
                            <button id="addFileBtn" class="btn btn-secondary btn-icon-only" title="New File">
                                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                            </button>
                            <button id="refreshFilesBtn" class="btn btn-secondary btn-icon-only" title="Refresh Files">
                                <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                            </button>
                        </div>
                    </div>
                    <ul id="fileList" class="file-list"></ul>
                </aside>

                <div class="workspace-main">
                    <div class="editor-header">
                        <div class="current-file-path">
                            <svg style="width: 1rem; height: 1rem; fill: var(--text-secondary);" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                            <span id="activeFilePath">Select a file</span>
                        </div>

                        <div class="editor-tabs">
                            <button id="editorTabBtn" class="tab-btn active">Code Editor</button>
                            <button id="previewTabBtn" class="tab-btn">Live Preview</button>
                            <button id="saveFileBtn" class="btn btn-primary" style="margin-left: 0.375rem;">
                                <svg viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
                                Save Changes
                            </button>
                        </div>
                    </div>

                    <div id="editorTab" class="editor-container">
                        <div id="lineNumbers" class="line-numbers">
                            <div class="line-number-item">1</div>
                        </div>
                        <textarea id="codeTextarea" class="code-textarea" spellcheck="false" placeholder="Select or create a file to start editing..."></textarea>
                    </div>

                    <div id="previewTab" class="editor-container hidden">
                        <iframe id="previewIframe" class="preview-iframe" sandbox="allow-scripts allow-same-origin"></iframe>
                    </div>

                    <div class="editor-footer">
                        <div id="editorStatus">Lines: 1 | Characters: 0</div>
                        <div id="encodingStatus">UTF-8</div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- CREATE REPO MODAL -->
    <div id="createRepoModal" class="modal-overlay">
        <div class="modal-card">
            <h2 class="modal-title">Create New Repository</h2>
            <div class="form-group">
                <label class="form-label">Repository Name</label>
                <input type="text" id="newRepoName" class="form-input" placeholder="my-repo">
            </div>
            <div class="form-group">
                <label class="form-label">Description (optional)</label>
                <input type="text" id="newRepoDesc" class="form-input" placeholder="Description">
            </div>
            <div class="form-group">
                <label class="form-checkbox-label">
                    <input type="checkbox" id="newRepoPrivate" class="checkbox-custom"> Private Repository
                </label>
            </div>
            <div class="form-group">
                <label class="form-checkbox-label">
                    <input type="checkbox" id="newRepoAutoInit" class="checkbox-custom" checked> Initialize with README
                </label>
            </div>
            <div class="modal-actions">
                <button id="cancelCreateRepoBtn" class="btn btn-secondary">Cancel</button>
                <button id="confirmCreateRepoBtn" class="btn btn-primary">Create</button>
            </div>
        </div>
    </div>

    <!-- CREATE FILE MODAL -->
    <div id="createFileModal" class="modal-overlay">
        <div class="modal-card">
            <h2 class="modal-title">Create New File</h2>
            <div class="form-group">
                <label class="form-label">File Path / Name</label>
                <input type="text" id="newFilePath" class="form-input" placeholder="index.html">
            </div>
            <div class="modal-actions">
                <button id="cancelCreateFileBtn" class="btn btn-secondary">Cancel</button>
                <button id="confirmCreateFileBtn" class="btn btn-primary">Create File</button>
            </div>
        </div>
    </div>

    <!-- CONFIRM DELETE MODAL -->
    <div id="deleteModal" class="modal-overlay">
        <div class="modal-card">
            <h2 class="modal-title">Confirm Deletion</h2>
            <p id="deleteModalMessage" style="color: var(--text-secondary); font-size: 0.8125rem;">Are you sure you want to delete this item? This action cannot be undone.</p>
            <div class="modal-actions">
                <button id="cancelDeleteBtn" class="btn btn-secondary">Cancel</button>
                <button id="confirmDeleteBtn" class="btn btn-danger">Delete</button>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script>
        // State Management
        const state = {
            token: localStorage.getItem('gh_token') || '',
            repos: [],
            selectedRepos: new Set(),
            currentRepoOwner: '',
            currentRepoName: '',
            currentFiles: [],
            activeFileSha: '',
            activeFilePath: '',
            deleteTargetType: null,
            deleteTargetData: null
        };

        // DOM Elements
        const tokenInputContainer = document.getElementById('tokenInputContainer');
        const tokenSavedContainer = document.getElementById('tokenSavedContainer');
        const tokenInput = document.getElementById('tokenInput');
        const saveTokenBtn = document.getElementById('saveTokenBtn');
        const changeTokenBtn = document.getElementById('changeTokenBtn');
        const openNewRepoModalBtn = document.getElementById('openNewRepoModalBtn');
        
        const reposView = document.getElementById('reposView');
        const workspaceView = document.getElementById('workspaceView');
        const backToReposBtn = document.getElementById('backToReposBtn');
        const reposGrid = document.getElementById('reposGrid');
        const repoSearchInput = document.getElementById('repoSearchInput');
        const refreshReposBtn = document.getElementById('refreshReposBtn');
        const selectAllCheckbox = document.getElementById('selectAllCheckbox');
        const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
        const selectedCount = document.getElementById('selectedCount');

        const breadcrumbRepo = document.getElementById('breadcrumbRepo');
        const breadcrumbCurrentRepo = document.getElementById('breadcrumbCurrentRepo');
        const fileList = document.getElementById('fileList');
        const addFileBtn = document.getElementById('addFileBtn');
        const refreshFilesBtn = document.getElementById('refreshFilesBtn');
        const activeFilePath = document.getElementById('activeFilePath');
        const codeTextarea = document.getElementById('codeTextarea');
        const lineNumbers = document.getElementById('lineNumbers');
        const editorStatus = document.getElementById('editorStatus');
        const saveFileBtn = document.getElementById('saveFileBtn');
        const editorTabBtn = document.getElementById('editorTabBtn');
        const previewTabBtn = document.getElementById('previewTabBtn');
        const editorTab = document.getElementById('editorTab');
        const previewTab = document.getElementById('previewTab');
        const previewIframe = document.getElementById('previewIframe');

        const createRepoModal = document.getElementById('createRepoModal');
        const cancelCreateRepoBtn = document.getElementById('cancelCreateRepoBtn');
        const confirmCreateRepoBtn = document.getElementById('confirmCreateRepoBtn');
        const newRepoName = document.getElementById('newRepoName');
        const newRepoDesc = document.getElementById('newRepoDesc');
        const newRepoPrivate = document.getElementById('newRepoPrivate');
        const newRepoAutoInit = document.getElementById('newRepoAutoInit');

        const createFileModal = document.getElementById('createFileModal');
        const cancelCreateFileBtn = document.getElementById('cancelCreateFileBtn');
        const confirmCreateFileBtn = document.getElementById('confirmCreateFileBtn');
        const newFilePath = document.getElementById('newFilePath');

        const deleteModal = document.getElementById('deleteModal');
        const deleteModalMessage = document.getElementById('deleteModalMessage');
        const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');

        const toastContainer = document.getElementById('toastContainer');

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        function updateTokenUI() {
            if (state.token) {
                tokenInputContainer.classList.add('hidden');
                tokenSavedContainer.classList.remove('hidden');
            } else {
                tokenInputContainer.classList.remove('hidden');
                tokenSavedContainer.classList.add('hidden');
            }
        }

        function utf8ToBase64(str) {
            return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (match, p1) => {
                return String.fromCharCode('0x' + p1);
            }));
        }

        function base64ToUtf8(str) {
            try {
                const cleanStr = str.replace(/\n/g, '');
                return decodeURIComponent(Array.prototype.map.call(atob(cleanStr), c => {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
            } catch(e) {
                return atob(str);
            }
        }

        async function githubApi(endpoint, options = {}) {
            const token = state.token;
            if (!token) {
                throw new Error('Please enter a GitHub Personal Access Token');
            }

            const headers = {
                'Accept': 'application/vnd.github.v3+json',
                'Authorization': `token ${token}`,
                ...options.headers
            };

            const response = await fetch(`https://api.github.com${endpoint}`, {
                ...options,
                headers
            });

            if (!response.ok) {
                const err = await response.json().catch(() => ({ message: 'API Request failed' }));
                throw new Error(err.message || 'API Error');
            }

            if (response.status === 204) return true;
            return await response.json();
        }

        async function loadRepositories() {
            if (!state.token) {
                reposGrid.innerHTML = '<div class="empty-state">Please enter and save your GitHub Personal Access Token above.</div>';
                return;
            }

            try {
                reposGrid.innerHTML = '<div class="empty-state">Loading repositories...</div>';
                state.selectedRepos.clear();
                updateSelectionState();
                const repos = await githubApi('/user/repos?sort=updated&per_page=100');
                state.repos = repos;
                renderRepositories(repos);
            } catch (err) {
                reposGrid.innerHTML = `<div class="empty-state">Error: ${err.message}</div>`;
                showToast(`Failed to load repositories: ${err.message}`, 'error');
            }
        }

        function renderRepositories(repos) {
            reposGrid.innerHTML = '';
            if (!repos || repos.length === 0) {
                reposGrid.innerHTML = '<div class="empty-state">No repositories found.</div>';
                return;
            }

            repos.forEach((repo, idx) => {
                const card = document.createElement('div');
                const repoKey = `${repo.owner.login}/${repo.name}`;
                const isChecked = state.selectedRepos.has(repoKey);
                
                card.className = `repo-card ${isChecked ? 'selected' : ''}`;
                card.style.setProperty('--stagger-index', idx);

                card.innerHTML = `
                    <div class="repo-card-header">
                        <div class="repo-title-area">
                            <input type="checkbox" class="checkbox-custom repo-checkbox" data-key="${repoKey}" ${isChecked ? 'checked' : ''}>
                            <span class="repo-name" title="${repo.name}">${repo.name}</span>
                        </div>
                        <span class="badge">${repo.private ? 'Private' : 'Public'}</span>
                    </div>
                    <div class="repo-desc">${repo.description || 'No description provided.'}</div>
                    <div class="repo-card-actions">
                        <button class="btn btn-secondary open-repo-btn" data-owner="${repo.owner.login}" data-name="${repo.name}">
                            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                            Edit
                        </button>
                        <button class="btn btn-danger btn-icon-only delete-repo-btn" data-owner="${repo.owner.login}" data-name="${repo.name}" title="Delete Repository">
                            <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        </button>
                    </div>
                `;

                reposGrid.appendChild(card);
            });

            document.querySelectorAll('.repo-checkbox').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    const key = e.target.getAttribute('data-key');
                    const cardElement = e.target.closest('.repo-card');
                    if (e.target.checked) {
                        state.selectedRepos.add(key);
                        cardElement.classList.add('selected');
                    } else {
                        state.selectedRepos.delete(key);
                        cardElement.classList.remove('selected');
                    }
                    updateSelectionState();
                });
            });

            document.querySelectorAll('.open-repo-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const owner = e.currentTarget.getAttribute('data-owner');
                    const name = e.currentTarget.getAttribute('data-name');
                    openRepositoryWorkspace(owner, name);
                });
            });

            document.querySelectorAll('.delete-repo-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const owner = e.currentTarget.getAttribute('data-owner');
                    const name = e.currentTarget.getAttribute('data-name');
                    confirmDeleteRepository(owner, name);
                });
            });
        }

        function updateSelectionState() {
            const count = state.selectedRepos.size;
            selectedCount.textContent = count;
            if (count > 0) {
                deleteSelectedBtn.classList.remove('hidden');
            } else {
                deleteSelectedBtn.classList.add('hidden');
            }

            const visibleCheckboxes = document.querySelectorAll('.repo-checkbox');
            if (visibleCheckboxes.length > 0 && Array.from(visibleCheckboxes).every(cb => cb.checked)) {
                selectAllCheckbox.checked = true;
            } else {
                selectAllCheckbox.checked = false;
            }
        }

        selectAllCheckbox.addEventListener('change', (e) => {
            const isChecked = e.target.checked;
            const visibleCheckboxes = document.querySelectorAll('.repo-checkbox');
            visibleCheckboxes.forEach(cb => {
                cb.checked = isChecked;
                const key = cb.getAttribute('data-key');
                const cardElement = cb.closest('.repo-card');
                if (isChecked) {
                    state.selectedRepos.add(key);
                    cardElement.classList.add('selected');
                } else {
                    state.selectedRepos.delete(key);
                    cardElement.classList.remove('selected');
                }
            });
            updateSelectionState();
        });

        deleteSelectedBtn.addEventListener('click', () => {
            if (state.selectedRepos.size === 0) return;
            state.deleteTargetType = 'selected-repos';
            deleteModalMessage.textContent = `Are you sure you want to delete ${state.selectedRepos.size} selected repository(ies)? This action cannot be undone.`;
            deleteModal.classList.add('active');
        });

        async function openRepositoryWorkspace(owner, name) {
            state.currentRepoOwner = owner;
            state.currentRepoName = name;
            state.activeFilePath = '';
            state.activeFileSha = '';

            breadcrumbCurrentRepo.textContent = name;
            reposView.classList.add('hidden');
            workspaceView.classList.remove('hidden');

            codeTextarea.value = '';
            activeFilePath.textContent = 'Select a file';
            updateLineNumbers();

            await loadRepositoryFiles();
        }

        async function loadRepositoryFiles(path = '') {
            try {
                fileList.innerHTML = '<li class="file-item">Loading files...</li>';
                const files = await githubApi(`/repos/${state.currentRepoOwner}/${state.currentRepoName}/contents/${path}`);
                state.currentFiles = Array.isArray(files) ? files : [files];
                renderFileList(state.currentFiles);
            } catch (err) {
                fileList.innerHTML = `<li class="file-item">Error loading files</li>`;
                showToast(`Failed to load files: ${err.message}`, 'error');
            }
        }

        function renderFileList(files) {
            fileList.innerHTML = '';
            if (!files || files.length === 0) {
                fileList.innerHTML = '<li class="file-item">No files in directory.</li>';
                return;
            }

            files.forEach(file => {
                const li = document.createElement('li');
                li.className = 'file-item';
                const isDir = file.type === 'dir';

                li.innerHTML = `
                    <div class="file-item-info">
                        ${isDir 
                            ? '<svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>'
                            : '<svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>'
                        }
                        <span>${file.name}</span>
                    </div>
                    <div class="file-item-actions">
                        ${!isDir ? `
                            <button class="btn btn-secondary btn-icon-only delete-file-btn" data-path="${file.path}" data-sha="${file.sha}" title="Delete File">
                                <svg style="width: 0.75rem; height: 0.75rem;" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                            </button>
                        ` : ''}
                    </div>
                `;

                li.addEventListener('click', (e) => {
                    if (e.target.closest('.delete-file-btn')) return;
                    if (isDir) {
                        loadRepositoryFiles(file.path);
                    } else {
                        document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
                        li.classList.add('active');
                        loadFileContent(file.path, file.sha);
                    }
                });

                fileList.appendChild(li);
            });

            document.querySelectorAll('.delete-file-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const path = btn.getAttribute('data-path');
                    const sha = btn.getAttribute('data-sha');
                    confirmDeleteFile(path, sha);
                });
            });
        }

        async function loadFileContent(path, sha) {
            try {
                showToast('Loading file...', 'info');
                const fileData = await githubApi(`/repos/${state.currentRepoOwner}/${state.currentRepoName}/contents/${path}`);
                state.activeFilePath = path;
                state.activeFileSha = fileData.sha;
                activeFilePath.textContent = path;

                const content = base64ToUtf8(fileData.content || '');
                codeTextarea.value = content;
                updateLineNumbers();
                updateLivePreview();
                showToast('File loaded successfully', 'success');
            } catch (err) {
                showToast(`Failed to load file content: ${err.message}`, 'error');
            }
        }

        async function saveActiveFile() {
            if (!state.activeFilePath) {
                showToast('No active file selected to save', 'error');
                return;
            }

            try {
                showToast('Saving file...', 'info');
                const contentEncoded = utf8ToBase64(codeTextarea.value);

                const response = await githubApi(`/repos/${state.currentRepoOwner}/${state.currentRepoName}/contents/${state.activeFilePath}`, {
                    method: 'PUT',
                    body: JSON.stringify({
                        message: `Update ${state.activeFilePath}`,
                        content: contentEncoded,
                        sha: state.activeFileSha
                    })
                });

                state.activeFileSha = response.content.sha;
                showToast('File saved successfully', 'success');
                updateLivePreview();
            } catch (err) {
                showToast(`Save failed: ${err.message}`, 'error');
            }
        }

        function confirmDeleteRepository(owner, name) {
            state.deleteTargetType = 'repo';
            state.deleteTargetData = { owner, name };
            deleteModalMessage.textContent = `Are you sure you want to delete repository "${name}"? This action cannot be undone.`;
            deleteModal.classList.add('active');
        }

        function confirmDeleteFile(path, sha) {
            state.deleteTargetType = 'file';
            state.deleteTargetData = { path, sha };
            deleteModalMessage.textContent = `Are you sure you want to delete file "${path}"?`;
            deleteModal.classList.add('active');
        }

        async function executeDeletion() {
            deleteModal.classList.remove('active');
            if (state.deleteTargetType === 'repo') {
                const { owner, name } = state.deleteTargetData;
                try {
                    await githubApi(`/repos/${owner}/${name}`, { method: 'DELETE' });
                    showToast('Repository deleted', 'success');
                    loadRepositories();
                } catch (err) {
                    showToast(`Failed to delete repo: ${err.message}`, 'error');
                }
            } else if (state.deleteTargetType === 'selected-repos') {
                try {
                    showToast(`Deleting ${state.selectedRepos.size} repositories...`, 'info');
                    for (const key of state.selectedRepos) {
                        const [owner, name] = key.split('/');
                        await githubApi(`/repos/${owner}/${name}`, { method: 'DELETE' });
                    }
                    showToast('Selected repositories deleted successfully', 'success');
                    state.selectedRepos.clear();
                    loadRepositories();
                } catch (err) {
                    showToast(`Deletion failed: ${err.message}`, 'error');
                }
            } else if (state.deleteTargetType === 'file') {
                const { path, sha } = state.deleteTargetData;
                try {
                    await githubApi(`/repos/${state.currentRepoOwner}/${state.currentRepoName}/contents/${path}`, {
                        method: 'DELETE',
                        body: JSON.stringify({
                            message: `Delete ${path}`,
                            sha: sha
                        })
                    });
                    showToast('File deleted', 'success');
                    if (state.activeFilePath === path) {
                        state.activeFilePath = '';
                        state.activeFileSha = '';
                        codeTextarea.value = '';
                        activeFilePath.textContent = 'Select a file';
                        updateLineNumbers();
                    }
                    loadRepositoryFiles();
                } catch (err) {
                    showToast(`Failed to delete file: ${err.message}`, 'error');
                }
            }
        }

        async function createNewRepository() {
            const name = newRepoName.value.trim();
            const description = newRepoDesc.value.trim();
            const isPrivate = newRepoPrivate.checked;
            const autoInit = newRepoAutoInit.checked;

            if (!name) {
                showToast('Repository name is required', 'error');
                return;
            }

            try {
                showToast('Creating repository...', 'info');
                await githubApi('/user/repos', {
                    method: 'POST',
                    body: JSON.stringify({
                        name,
                        description,
                        private: isPrivate,
                        auto_init: autoInit
                    })
                });

                createRepoModal.classList.remove('active');
                newRepoName.value = '';
                newRepoDesc.value = '';
                showToast('Repository created', 'success');
                loadRepositories();
            } catch (err) {
                showToast(`Create repo failed: ${err.message}`, 'error');
            }
        }

        async function createNewFile() {
            const path = newFilePath.value.trim();
            if (!path) {
                showToast('File path is required', 'error');
                return;
            }

            try {
                showToast('Creating file...', 'info');
                const emptyContent = utf8ToBase64('');
                await githubApi(`/repos/${state.currentRepoOwner}/${state.currentRepoName}/contents/${path}`, {
                    method: 'PUT',
                    body: JSON.stringify({
                        message: `Create ${path}`,
                        content: emptyContent
                    })
                });

                createFileModal.classList.remove('active');
                newFilePath.value = '';
                showToast('File created', 'success');
                loadRepositoryFiles();
            } catch (err) {
                showToast(`Create file failed: ${err.message}`, 'error');
            }
        }

        function updateLineNumbers() {
            const lines = codeTextarea.value.split('\n');
            const lineCount = lines.length;
            let lineNumsHtml = '';
            for (let i = 1; i <= lineCount; i++) {
                lineNumsHtml += `<div class="line-number-item">${i}</div>`;
            }
            lineNumbers.innerHTML = lineNumsHtml;
            editorStatus.textContent = `Lines: ${lineCount} | Characters: ${codeTextarea.value.length}`;
        }

        function updateLivePreview() {
            if (state.activeFilePath.endsWith('.html') || state.activeFilePath.endsWith('.htm')) {
                previewIframe.srcdoc = codeTextarea.value;
            } else {
                previewIframe.srcdoc = `<html><body style="background:hsla(209,9%,13%,1);color:hsla(209,20%,95%,1);font-family:sans-serif;padding:2rem;"><h3>Preview not available for non-HTML files directly.</h3></body></html>`;
            }
        }

        codeTextarea.addEventListener('scroll', () => {
            lineNumbers.scrollTop = codeTextarea.scrollTop;
        });

        codeTextarea.addEventListener('input', () => {
            updateLineNumbers();
            updateLivePreview();
        });

        codeTextarea.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = codeTextarea.selectionStart;
                const end = codeTextarea.selectionEnd;
                codeTextarea.value = codeTextarea.value.substring(0, start) + '  ' + codeTextarea.value.substring(end);
                codeTextarea.selectionStart = codeTextarea.selectionEnd = start + 2;
                updateLineNumbers();
            }
        });

        // SAVE TOKEN LOGIC
        saveTokenBtn.addEventListener('click', () => {
            const tokenValue = tokenInput.value.trim();
            if (!tokenValue) {
                showToast('Please enter a Personal Access Token', 'error');
                return;
            }
            state.token = tokenValue;
            localStorage.setItem('gh_token', tokenValue);
            tokenInput.value = '';
            updateTokenUI();
            showToast('Token saved successfully', 'success');
            loadRepositories();
        });

        changeTokenBtn.addEventListener('click', () => {
            tokenInputContainer.classList.remove('hidden');
            tokenSavedContainer.classList.add('hidden');
            tokenInput.focus();
        });

        refreshReposBtn.addEventListener('click', loadRepositories);

        repoSearchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = state.repos.filter(r => 
                r.name.toLowerCase().includes(query) || 
                (r.description && r.description.toLowerCase().includes(query))
            );
            renderRepositories(filtered);
        });

        function backToRepos() {
            workspaceView.classList.add('hidden');
            reposView.classList.remove('hidden');
        }

        backToReposBtn.addEventListener('click', backToRepos);
        breadcrumbRepo.addEventListener('click', backToRepos);

        addFileBtn.addEventListener('click', () => {
            createFileModal.classList.add('active');
        });

        refreshFilesBtn.addEventListener('click', () => {
            loadRepositoryFiles();
        });

        saveFileBtn.addEventListener('click', saveActiveFile);

        editorTabBtn.addEventListener('click', () => {
            editorTabBtn.classList.add('active');
            previewTabBtn.classList.remove('active');
            editorTab.classList.remove('hidden');
            previewTab.classList.add('hidden');
        });

        previewTabBtn.addEventListener('click', () => {
            previewTabBtn.classList.add('active');
            editorTabBtn.classList.remove('active');
            previewTab.classList.remove('hidden');
            editorTab.classList.add('hidden');
            updateLivePreview();
        });

        openNewRepoModalBtn.addEventListener('click', () => {
            createRepoModal.classList.add('active');
        });

        cancelCreateRepoBtn.addEventListener('click', () => {
            createRepoModal.classList.remove('active');
        });

        confirmCreateRepoBtn.addEventListener('click', createNewRepository);

        cancelCreateFileBtn.addEventListener('click', () => {
            createFileModal.classList.remove('active');
        });

        confirmCreateFileBtn.addEventListener('click', createNewFile);

        cancelDeleteBtn.addEventListener('click', () => {
            deleteModal.classList.remove('active');
        });

        confirmDeleteBtn.addEventListener('click', executeDeletion);

        // Initial Initialization
        updateTokenUI();
        if (state.token) {
            loadRepositories();
        } else {
            reposGrid.innerHTML = '<div class="empty-state">Please enter and save your GitHub Personal Access Token above.</div>';
        }
    </script>
</body>
</html>
